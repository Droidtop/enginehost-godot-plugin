name: Build Enginehost bundle

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build embedded Godot runtime APK
        run: gradle -p enginehost-android :app:assembleDebug --no-daemon --stacktrace
      - name: Build signed Enginehost bundle
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          APK=enginehost-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          mkdir -p build/payload/runtime build/payload/lib build/output
          cp "$APK" build/payload/runtime/godot.apk
          python3 - <<'PY'
          import pathlib, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          root = pathlib.Path('build/payload')
          for info in apk.infolist():
              if info.filename.startswith('lib/') and info.filename.endswith('.so'):
                  target = root / info.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read(info))
          PY
          cp LICENSE.txt COPYRIGHT.txt build/payload/
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.godot.v47.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-godot-4.7-v1
          path: build/output/*
