name: Build Enginehost bundle

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this signed bundle to the selected channel"
        type: boolean
        default: false
      channel:
        description: "Release channel"
        type: choice
        options: [stable, testing]
        default: testing
      tag:
        description: "Base release tag; the channel suffix is added when needed"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build embedded Godot runtime APK
        run: gradle -p enginehost-android :app:assembleDebug --no-daemon --stacktrace
      - name: Build signed Enginehost bundle
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          APK=enginehost-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          mkdir -p build/payload/runtime build/payload/lib build/output
          cp "$APK" build/payload/runtime/godot.apk
          python3 - <<'PY'
          import pathlib, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          root = pathlib.Path('build/payload')
          for info in apk.infolist():
              if info.filename.startswith('lib/') and info.filename.endswith('.so'):
                  target = root / info.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read(info))
          PY
          cp LICENSE.txt COPYRIGHT.txt build/payload/
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output build/output/dev.enginehost.godot.v47.v1.enginehost.tar.xz \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-godot-4.7-v1
          path: build/output/*

  publish:
    needs: bundle
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Publish signed Enginehost bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bundle="$(find release -name '*.enginehost.tar.xz' -print -quit)"
          envelope="$(find release -name 'enginehost-release.json' -print -quit)"
          keydoc="$(find release -name 'enginehost-public-key.json' -print -quit)"
          test -f "$bundle" && test -f "$envelope" && test -f "$keydoc"
          channel=unstable
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            channel="$REQUESTED_CHANNEL"
          fi
          python3 - "$envelope" "$channel" <<'PY'
          import json, sys
          path, channel = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["channel"] = channel
          json.dump(data, open(path, "w"), indent=2)
          PY
          id="$(basename "$bundle" .enginehost.tar.xz)"
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(printf '%s' "$id" | sed 's/^dev\.enginehost\.//; s/\./-/g')"
          fi
          prerelease=""
          case "$channel" in
            stable) ;;
            testing) [[ "$tag" == *-testing ]] || tag="$tag-testing"; prerelease="--prerelease" ;;
            unstable) [[ "$tag" == *-unstable ]] || tag="$tag-unstable"; prerelease="--prerelease" ;;
            *) echo "unknown channel: $channel" >&2; exit 1 ;;
          esac
          notes="Signed Enginehost bundle \`$id\` on the **$channel** channel, built from \`${{ github.ref_name }}\` at \`${{ github.sha }}\` (build ${{ github.run_number }})."
          if [ "$channel" = unstable ] || [ "$channel" = testing ]; then
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$bundle" "$envelope" "$keydoc" \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "$id ($channel)" $prerelease --notes "$notes"
          elif gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$envelope" "$keydoc" \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create "$tag" "$bundle" "$envelope" "$keydoc" \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "$id ($channel)" $prerelease --notes "$notes"
          fi
