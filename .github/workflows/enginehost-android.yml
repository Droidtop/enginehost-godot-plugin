name: Build Enginehost bundle

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spine-runtime:
    name: Godot runtime with spine_godot (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The spine-godot runtime, pinned to the 4.2 branch that matches the
      # Spine 4.2.x editor exports found in shipping Godot games. It is
      # compiled into libgodot_android.so as an engine module, the same way
      # those games' own desktop binaries embed it.
      - uses: actions/checkout@v4
        with:
          repository: EsotericSoftware/spine-runtimes
          ref: e7dc1435fa4a0083ab431f1b28e083c14a1f5c68
          path: spine-runtimes-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: enginehost-spine-android-arm64
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built Android Swappy Frame Pacing Library
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-swappy
          version: tags/from-source-2025-01-31
          file: godot-swappy.7z
          target: swappy/godot-swappy.7z

      - name: Extract pre-built Android Swappy Frame Pacing Library
        run: 7za x -y swappy/godot-swappy.7z -o${{ github.workspace }}/thirdparty/swappy-frame-pacing

      - name: Stage the spine_godot module
        run: cp -r spine-runtimes-src/spine-cpp/spine-cpp spine-runtimes-src/spine-godot/spine_godot/

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            arch=arm64
            swappy=yes
            tests=no
            custom_modules=${{ github.workspace }}/spine-runtimes-src/spine-godot/spine_godot
          platform: android
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: enginehost-spine-android-arm64
        continue-on-error: true

      - name: Verify the runtime actually contains spine
        run: |
          LIB=platform/android/java/lib/libs/release/arm64-v8a/libgodot_android.so
          test -f "$LIB"
          strings -a "$LIB" | grep -q SpineSkeletonDataResource
          strings -a "$LIB" | grep -q SpineSprite

      - name: Stage artifact
        run: |
          mkdir -p spine-runtime-out/arm64-v8a
          cp platform/android/java/lib/libs/release/arm64-v8a/libgodot_android.so spine-runtime-out/arm64-v8a/
          cp platform/android/java/lib/libs/release/arm64-v8a/libc++_shared.so spine-runtime-out/arm64-v8a/
          cp spine-runtimes-src/LICENSE spine-runtime-out/LICENSE-spine-runtimes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spine-godot-runtime-arm64
          path: spine-runtime-out/*

  bundle:
    runs-on: ubuntu-latest
    needs: spine-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droidtop/enginehost
          ref: codex/engine-bundles
          path: enginehost-tooling
      - uses: actions/download-artifact@v4
        with:
          name: spine-godot-runtime-arm64
          path: spine-runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Put the spine-enabled runtime where the APK picks it up
        run: |
          mkdir -p enginehost-android/app/src/main/jniLibs/arm64-v8a
          cp spine-runtime/arm64-v8a/libgodot_android.so enginehost-android/app/src/main/jniLibs/arm64-v8a/
          cp spine-runtime/arm64-v8a/libc++_shared.so enginehost-android/app/src/main/jniLibs/arm64-v8a/
      - name: Build embedded Godot runtime APK
        run: gradle -p enginehost-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify the APK packaged the spine-enabled runtime
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          packed = hashlib.sha256(apk.read('lib/arm64-v8a/libgodot_android.so')).hexdigest()
          built = hashlib.sha256(pathlib.Path('spine-runtime/arm64-v8a/libgodot_android.so').read_bytes()).hexdigest()
          if packed != built:
              sys.exit('APK packaged the stock Godot runtime, not the spine-enabled build')
          print('APK carries the spine-enabled runtime:', packed)
          PY
      - name: Build signed Enginehost bundle
        env:
          ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}
        run: |
          APK=enginehost-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test -n "$ENGINEHOST_SIGNING_KEY_PEM"
          mkdir -p build/payload/runtime build/payload/lib build/output
          cp "$APK" build/payload/runtime/godot.apk
          python3 - <<'PY'
          import pathlib, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          root = pathlib.Path('build/payload')
          for info in apk.infolist():
              if info.filename.startswith('lib/') and info.filename.endswith('.so'):
                  target = root / info.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read(info))
          PY
          cp LICENSE.txt COPYRIGHT.txt build/payload/
          cp spine-runtime/LICENSE-spine-runtimes.txt build/payload/
          printf '%s' "$ENGINEHOST_SIGNING_KEY_PEM" > build/signing-key.pem
          # The bundle identity is the metadata's, so a version branch
          # cannot emit a file claiming to be a different release.
          BUNDLE_ID=$(python3 -c "import json;print(json.load(open('enginehost/bundle-metadata.json'))['bundleId'])")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          python3 enginehost-tooling/scripts/build-engine-bundle.py \
            --metadata enginehost/bundle-metadata.json --payload build/payload \
            --private-key build/signing-key.pem \
            --repository-key-document enginehost-public-key.json \
            --output "build/output/${BUNDLE_ID}.enginehost.tar.xz" \
            --release-envelope build/output/enginehost-release.json \
            --public-key-document build/output/enginehost-public-key.json
          cmp enginehost-public-key.json build/output/enginehost-public-key.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_ID }}
          path: build/output/*
