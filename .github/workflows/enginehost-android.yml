name: Build Enginehost bundle

on:
  push:
    branches: [plugin-core, "plugin/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Promote this build to a GitHub Release on the chosen channel. Stable is
          for a bundle that has been used with real games on hardware; testing
          for one that runs games but has not been lived with. Every push
          already publishes to the unstable channel by itself.
        type: boolean
        default: false
      channel:
        description: "Release channel for a promoted build"
        type: choice
        options: [stable, testing]
        default: stable
      tag:
        description: "Release tag (default: derived from the bundle id; testing adds -testing)"
        type: string
        default: ""

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-runtime:
    # The engine this line runs, built from this branch's Godot source (it
    # carries Enginehost's engine changes: the presented platform, pack keys,
    # save path) with NO extra module compiled in. Runtime components such as
    # spine-godot are separate payload members loaded as GDExtensions
    # (spine-godot-extension below; Enginehost docs/engine-bundle-format.md,
    # "Runtime components (subplugins)"), so this one engine build serves
    # every component combination the bundle declares.
    # One bundle carries every ABI it supports and the host picks lib/<abi>
    # from Build.SUPPORTED_ABIS, so the runtime is compiled once per ABI.
    # `arch` is the SCons name and `abi` is the directory Godot writes into.
    name: Godot runtime (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: enginehost-android-${{ matrix.arch }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built Android Swappy Frame Pacing Library
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # 1.1.2
        with:
          repo: godotengine/godot-swappy
          version: tags/from-source-2025-01-31
          file: godot-swappy.7z
          target: swappy/godot-swappy.7z

      - name: Extract pre-built Android Swappy Frame Pacing Library
        run: 7za x -y swappy/godot-swappy.7z -o${{ github.workspace }}/thirdparty/swappy-frame-pacing

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            arch=${{ matrix.arch }}
            swappy=yes
            tests=no
          platform: android
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: enginehost-android-${{ matrix.arch }}
        continue-on-error: true

      - name: Verify the runtime carries no compiled-in spine
        # Spine comes only from the component; two copies of its classes
        # (module and extension) would register the same names twice.
        run: |
          LIB=platform/android/java/lib/libs/release/${{ matrix.abi }}/libgodot_android.so
          test -f "$LIB"
          if strings -a "$LIB" | grep -q SpineSkeletonDataResource; then
            echo "::error::libgodot_android.so for ${{ matrix.abi }} has spine compiled in" >&2
            exit 1
          fi

      - name: Stage artifact
        run: |
          mkdir -p godot-runtime-out/${{ matrix.abi }}
          cp platform/android/java/lib/libs/release/${{ matrix.abi }}/libgodot_android.so godot-runtime-out/${{ matrix.abi }}/
          cp platform/android/java/lib/libs/release/${{ matrix.abi }}/libc++_shared.so godot-runtime-out/${{ matrix.abi }}/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-runtime-${{ matrix.abi }}
          path: godot-runtime-out/*

  spine-godot-extension:
    # The spine-godot runtime component: Esoteric's official GDExtension
    # flavor of spine-godot (spine-godot/build/build-extension.sh, godot-cpp),
    # pinned to the 4.2 branch that matches the Spine 4.2.x editor exports
    # found in shipping Godot games, built against godot-cpp for this engine
    # line. A few megabytes per ABI instead of a second engine build.
    name: spine-godot extension (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: EsotericSoftware/spine-runtimes
          ref: e7dc1435fa4a0083ab431f1b28e083c14a1f5c68
          path: spine-runtimes-src

      # godot-cpp at the engine line's release tag (godot-4.5-stable), so
      # the extension is built against exactly the API this engine exposes.
      # setup-extension.sh would clone the moving 4.5 branch instead; the
      # rest of what it does (spine-cpp into spine_godot) is the step below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: godotengine/godot-cpp
          ref: e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77
          path: spine-runtimes-src/spine-godot/godot-cpp

      - name: Setup SCons
        # The version Godot's own CI uses (.github/actions/godot-deps).
        run: |
          pipx install scons==4.9.0
          scons --version

      - name: Install the NDK godot-cpp builds with
        # godot-cpp names the exact NDK it expects (tools/android.py,
        # ndk_version) and looks for it under $ANDROID_HOME/ndk/.
        run: |
          set -euo pipefail
          NDK=$(python3 - <<'PY'
          import re
          text = open('spine-runtimes-src/spine-godot/godot-cpp/tools/android.py').read()
          print(re.search(r'"ndk_version",\s*"[^"]*",\s*"([0-9.]+)"', text).group(1))
          PY
          )
          echo "godot-cpp wants NDK $NDK"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` gets SIGPIPE when sdkmanager exits, which pipefail turns into a failure: accept the
          # licences on their own, then install without a pipe and print the log if it fails.
          (yes || true) | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;$NDK" >ndk-install.log 2>&1 || { tail -40 ndk-install.log; exit 1; }
          fi
          test -d "$ANDROID_HOME/ndk/$NDK"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Build the extension
        run: |
          set -euo pipefail
          cp -r spine-runtimes-src/spine-cpp/spine-cpp spine-runtimes-src/spine-godot/spine_godot/
          spine-runtimes-src/spine-godot/build/build-extension.sh android ${{ matrix.arch }}

      - name: Verify and stage the component
        run: |
          set -euo pipefail
          LIB=spine-runtimes-src/spine-godot/bin/android/libspine_godot.android.template_release.${{ matrix.arch }}.so
          test -f "$LIB"
          # The entry point the component's .gdextension names.
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$LIB"             | grep -qw spine_godot_library_init
          mkdir -p spine-godot-out/lib/${{ matrix.abi }}
          cp "$LIB" spine-godot-out/lib/${{ matrix.abi }}/libspine_godot.so
          cp spine-runtimes-src/LICENSE spine-godot-out/LICENSE-spine-runtimes.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spine-godot-extension-${{ matrix.abi }}
          path: spine-godot-out/*

  bundle:
    # Builds and packs the payload. No signing key and no write token here:
    # Gradle, its plugins and the third-party actions below run in this job
    # (Enginehost docs/security/2026-09-24-ci-supply-chain.md).
    runs-on: ubuntu-latest
    needs: [godot-runtime, spine-godot-extension]
    outputs:
      bundle-id: ${{ steps.pack.outputs.bundle-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Both ABIs' artifacts merge into one tree each, under lib/<abi> or <abi>.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: godot-runtime-*
          merge-multiple: true
          path: godot-runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spine-godot-extension-*
          merge-multiple: true
          path: spine-godot
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # 2026-09-16: setup-android's default package list still asks for the
      # obsolete "tools" SDK package, which Google has withdrawn from the
      # repository, so sdkmanager exits 1 and the job dies before Gradle runs.
      # The runner image already ships platform-tools and the command-line
      # tools; an empty list makes the action only put them on PATH.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Put the line's runtime where the APK picks it up
        run: |
          for abi in arm64-v8a x86_64; do
            mkdir -p "enginehost-android/app/src/main/jniLibs/$abi"
            cp "godot-runtime/$abi/libgodot_android.so" "enginehost-android/app/src/main/jniLibs/$abi/"
            cp "godot-runtime/$abi/libc++_shared.so" "enginehost-android/app/src/main/jniLibs/$abi/"
          done
      - name: Build embedded Godot runtime APK
        run: gradle -p enginehost-android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify the APK packaged the line's runtime
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          # Every ABI, so a bundle cannot ship this line's runtime for one and
          # the AAR's stock library (no Enginehost engine changes) for the other.
          for abi in ('arm64-v8a', 'x86_64'):
              packed = hashlib.sha256(apk.read(f'lib/{abi}/libgodot_android.so')).hexdigest()
              built = hashlib.sha256(pathlib.Path(f'godot-runtime/{abi}/libgodot_android.so').read_bytes()).hexdigest()
              if packed != built:
                  sys.exit(f'APK packaged the AAR runtime for {abi}, not this line\'s build')
              print(f'APK carries the line runtime for {abi}:', packed)
          PY
      - name: Pack the unsigned bundle inputs
        id: pack
        run: |
          set -euo pipefail
          APK=enginehost-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p build/unsigned/payload/runtime build/unsigned/payload/lib
          cp "$APK" build/unsigned/payload/runtime/godot.apk
          python3 - <<'PY'
          import pathlib, zipfile
          apk = zipfile.ZipFile('enginehost-android/app/build/outputs/apk/debug/app-debug.apk')
          root = pathlib.Path('build/unsigned/payload')
          for info in apk.infolist():
              if info.filename.startswith('lib/') and info.filename.endswith('.so'):
                  target = root / info.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(apk.read(info))
          PY
          # Both ABIs are the rule, not a preference: a bundle that lost one
          # would install and then fail to load on half the devices.
          test -f build/unsigned/payload/lib/arm64-v8a/libgodot_android.so
          test -f build/unsigned/payload/lib/x86_64/libgodot_android.so
          cp LICENSE.txt COPYRIGHT.txt build/unsigned/payload/
          # Every component the metadata declares, at
          # components/<name>/<version>/: its libraries for both ABIs, its
          # licence, and the .gdextension the wrapper hands the engine.
          python3 enginehost/stage-components.py build/unsigned/payload
          # The bundle identity is the metadata's, so a version branch
          # cannot emit a file claiming to be a different release.
          BUNDLE_ID=$(python3 -c "import json;print(json.load(open('enginehost/bundle-metadata.json'))['bundleId'])")
          echo "bundle-id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          cp enginehost/bundle-metadata.json build/unsigned/bundle-metadata.json
          # A tar keeps the file modes the manifest signs; an artifact would not.
          tar -cf build/unsigned.tar -C build/unsigned payload bundle-metadata.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.bundle-id }}-unsigned
          path: build/unsigned.tar
          if-no-files-found: error

  sign:
    # Enginehost's one signing mechanism, pinned by commit: the key never
    # shares a runner with the build.
    needs: bundle
    permissions:
      contents: read
    uses: Droidtop/enginehost/.github/workflows/sign-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      unsigned-artifact: ${{ needs.bundle.outputs.bundle-id }}-unsigned
      bundle: ${{ needs.bundle.outputs.bundle-id }}.enginehost.tar.xz
      artifact-name: ${{ needs.bundle.outputs.bundle-id }}
      # Empty on an ordinary push (no workflow_dispatch inputs exist then);
      # the stable-channel pre-1.0 guard only checks when this is "stable"
      # (docs/security/2026-09-27-pre-1.0-stable-guard.md).
      channel: ${{ inputs.channel }}
    secrets:
      ENGINEHOST_SIGNING_KEY_PEM: ${{ secrets.ENGINEHOST_SIGNING_KEY_PEM }}

  publish:
    # Promotion is deliberate: a manual dispatch names the channel. Stable
    # means used with real games on hardware; testing means it runs games
    # but has not been lived with. Enginehost offers each person the channel
    # they chose in Settings and every steadier one. The release logic lives
    # once, in Droidtop/enginehost (Droidtop/tracker#196).
    needs: [bundle, sign]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: ${{ needs.bundle.outputs.bundle-id }}
      channel: ${{ inputs.channel }}
      tag: ${{ inputs.tag }}
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}

  unstable:
    # Every green push that produced a signed bundle is published as-is on
    # the unstable channel, replacing the previous one, so a person who opted
    # into unstable in Enginehost sees each build the moment CI is done with
    # it, and the build also gets its permanent history release. Branches
    # whose build makes no bundle publish nothing.
    needs: [bundle, sign]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: Droidtop/enginehost/.github/workflows/publish-engine-bundle.yml@f26c8161cc25de6743bd11f99d9f5879205a710a
    with:
      tooling-sha: f26c8161cc25de6743bd11f99d9f5879205a710a
      artifact-name: ${{ needs.bundle.outputs.bundle-id }}
      channel: unstable
    secrets:
      PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
