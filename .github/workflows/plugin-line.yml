name: Plugin line

# A line is exactly its upstream commit + plugin-core, both pinned in
# enginehost/line.json (Droidtop/tracker#324). The check lives once, in
# Droidtop/droidtop-platforms, pinned by commit; tool-ref names the same commit.
on:
  push:
    branches: [plugin-core, "plugin/**"]

permissions:
  contents: read

jobs:
  line:
    uses: Droidtop/droidtop-platforms/.github/workflows/plugin-line-check.yml@17a9d27c71c2cfe3aa4aceba96883642dd1735e2
    with:
      tool-ref: 17a9d27c71c2cfe3aa4aceba96883642dd1735e2
