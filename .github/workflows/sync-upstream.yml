name: Sync master with upstream godotengine/godot

# master exists purely as an always-current mirror of upstream
# godotengine/godot. Real plugin work happens on plugin/<line> branches,
# which pull from master on their own deliberate schedule rather than
# being auto-merged here: rebasing a patched branch unattended risks a
# silent, wrong conflict resolution, so that step stays manual by design.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
          # A write deploy key: unlike GITHUB_TOKEN it may push a merge that
          # changes upstream's own .github/workflows files.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Sync master with upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/godotengine/godot.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "master already contains upstream/master, nothing to do."
            exit 0
          fi

          # A plain merge, not --ff-only: this branch also carries our own
          # workflow files (and, on some plugin repos, small wrapper
          # commits upstream never has), so a byte-for-byte fast-forward
          # is not always possible even when there is no real conflict.
          # A genuine conflict still fails the job loudly, which is the
          # signal we want: someone committed engine changes to the mirror
          # branch and they belong on a plugin/* branch instead.
          git merge --no-edit upstream/master
          if git push origin master 2>/tmp/push.log; then
            exit 0
          fi
          cat /tmp/push.log >&2
          echo "PUSH_FAILED=true" >> "$GITHUB_ENV"

      - name: Open a follow-up issue if the push was rejected
        if: env.PUSH_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream sync: master merge could not be pushed"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title -q ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            # Still a failed sync: the run goes red every day until it is fixed.
            echo "issue already open, not filing a duplicate; the sync still failed"
            exit 1
          fi
          cat > /tmp/issue-body.md <<BODY
          The scheduled upstream-sync workflow merged
          upstream/master into master locally but could
          not push the result (see run log). The push uses the deploy key in
          the SYNC_DEPLOY_KEY secret; a rejection means that key is missing,
          revoked or read-only. master on GitHub is untouched. Run: $RUN_URL

          Restore the key, or merge by hand:
          \`\`\`
          git fetch upstream master
          git checkout master
          git merge upstream/master
          git push origin master
          \`\`\`
          BODY
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --body-file /tmp/issue-body.md
          exit 1
